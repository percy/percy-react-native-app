# Name of this GitHub Actions workflow.
name: Semgrep

on:
  # Scan changed files in PRs (diff-aware scanning):
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  semgrep:
    permissions:
      contents: read  # for actions/checkout to fetch code
      security-events: write  # for github/codeql-action/upload-sarif to upload SARIF results
    name: semgrep/ci
    runs-on: ubuntu-latest

    container:
      # A Docker image with Semgrep installed. Do not change this.
      image: returntocorp/semgrep

    # Skip any PR created by dependabot to avoid permission issues:
    if: (github.actor != 'dependabot[bot]')

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: semgrep ci --sarif --output=semgrep.sarif
        env:
          SEMGREP_RULES: p/default # more at semgrep.dev/explore

      - name: Upload SARIF file for GitHub Advanced Security Dashboard
        uses: github/codeql-action/upload-sarif@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          sarif_file: semgrep.sarif
        # Best-effort: the `semgrep ci` step above is the actual gate (it fails
        # the job on blocking findings). This dashboard upload requires GitHub
        # Advanced Security / code-scanning to be enabled on the repo; when it
        # isn't, the upload returns "Resource not accessible by integration".
        # Don't let that optional step turn an otherwise-clean scan red.
        continue-on-error: true
        if: always()
