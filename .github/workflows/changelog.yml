name: Release Drafter

on:
  # Runs only on the default branch: release-drafter reads its config from the
  # default branch, so a pull_request run on a branch that introduces the
  # config (or any branch) fails with "config not found". Drafting the next
  # release on push to main is the intended trigger.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  update_release_draft:
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
