name: Typecheck

on:
  push:
    branches: [main]
    paths:
      - 'packages/storybook-react-native/types/**'
      - 'packages/storybook-react-native/index.js'
      - '.github/workflows/typecheck.yml'
  pull_request:
    paths:
      - 'packages/storybook-react-native/types/**'
      - 'packages/storybook-react-native/index.js'
      - '.github/workflows/typecheck.yml'

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/storybook-react-native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Type-check shipped declarations
        # Parse and type-check the hand-written .d.ts so a malformed public
        # type surface fails CI before it ships to npm.
        run: npx -y -p typescript@5 tsc --noEmit --strict --skipLibCheck types/index.d.ts
