name: Release

on:
  release:
    types: [published]

# To publish: click "Draft a new release" in the GitHub UI, tag as `vX.Y.Z`
# matching packages/storybook-react-native/package.json `version`, target main,
# fill in notes, click "Publish release". This workflow then:
#   1. Re-runs lint + tests (defence in depth against shipping broken code).
#   2. Runs `npm publish` (plain, no provenance — matching percy/cli and
#      percy/percy-playwright; provenance adds an id-token requirement and a
#      repository.url validation that the sibling repos don't carry).
#
# Requires the `NPM_TOKEN` secret to be set on the repo (Automation token,
# scope: @percy + 2FA-bypass-for-CI). The npm dist-tag is read from
# `publishConfig.tag` in package.json (`latest` for stable releases).

jobs:
  publish:
    name: Publish @percy/storybook-react-native
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: packages/storybook-react-native

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match package.json version '$PKG_VERSION'"
            exit 1
          fi

      # The v0.1.0-beta.0 release died with `404 on PUT` — npm's masked
      # "token may not create/publish this package". Surface the token's
      # identity and @percy visibility BEFORE building, so an auth problem
      # fails in seconds with a readable message instead of a misleading 404.
      - name: Verify npm token can publish to @percy
        run: |
          echo "Token belongs to npm user: $(npm whoami)"
          if npm access list packages @percy > /dev/null 2>&1; then
            echo "Token's account can see @percy org packages."
          else
            echo "::error::This token's npm account cannot access the @percy org — publish will 404. Mint an Automation token from an account with @percy publish rights and update the NPM_TOKEN secret."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
