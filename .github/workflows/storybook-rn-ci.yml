name: storybook-rn CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/storybook-react-native/**'
      - '.github/workflows/storybook-rn-ci.yml'
  pull_request:
    paths:
      - 'packages/storybook-react-native/**'
      - '.github/workflows/storybook-rn-ci.yml'

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the declared engines floor (>=20.19.0 — the version where
        # require(esm) interop was backported, which the ESM-only storybook
        # deps need). 22 is active LTS; 24 keeps us ahead of customer drift.
        node: ['20', '22', '24']

    defaults:
      run:
        working-directory: packages/storybook-react-native

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: packages/storybook-react-native/coverage/
          retention-days: 14
