name: storybook-rn CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/storybook-react-native/**'
      - '.github/workflows/storybook-rn-ci.yml'
  pull_request:
    paths:
      - 'packages/storybook-react-native/**'
      - '.github/workflows/storybook-rn-ci.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: Which branch of @percy/cli to build from source for this run
        required: false
        default: master

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the declared engines floor (>=20.19.0 — the version where
        # require(esm) interop was backported, which the ESM-only storybook
        # deps need). 22 is active LTS; 24 keeps us ahead of customer drift.
        node: ['20', '22', '24']

    defaults:
      run:
        working-directory: packages/storybook-react-native

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Lint
        run: npm run lint

      - uses: actions-ecosystem/action-regex-match@9e6c4fb3d5e898f505be7a1fb6e7b0a278f6665b # v2.0.2
        id: regex-match
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          text: ${{ github.event.inputs.branch }}
          regex: '^[a-zA-Z0-9_/\-]+$'
      - name: Break on invalid branch name
        if: ${{ github.event_name == 'workflow_dispatch' && steps.regex-match.outputs && steps.regex-match.outputs.match == '' }}
        run: exit 1
      - name: Set up @percy/cli from git
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          BRANCH: ${{ github.event.inputs.branch }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          cd /tmp
          git clone --branch "$BRANCH" --depth 1 https://github.com/percy/cli
          cd cli
          PERCY_PACKAGES=`find packages -mindepth 1 -maxdepth 1 -type d | sed -e 's/packages/@percy/g' | tr '\n' ' '`
          yarn
          yarn build
          yarn global:link
          cd "$WORKSPACE"
          yarn link $PERCY_PACKAGES >/dev/null 2>&1 || true
          echo "$(yarn global bin)" >> "$GITHUB_PATH"
          export PATH="$(yarn global bin):$PATH"
          percy --version
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: matrix.node == '22'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: packages/storybook-react-native/coverage/
          retention-days: 14
